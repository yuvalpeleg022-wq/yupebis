<!doctype html>
<html lang="he">
<head>

<title>Marvel Gikim trailer — realistic edits</title>

<style>
  :root { --g: #2BE38A; --g-hi: #B6FFD6; --gold: #FFC35C;
    --metal: linear-gradient(180deg, #ffffff 0%, #eef6f2 34%, #a9bab2 49%, #5d6d66 55%, #cfdcd6 76%, #ffffff 100%); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  body { font-family: 'Heebo', sans-serif; color: #fff; direction: rtl; }
  #wrap { position: absolute; inset: 0; transform-origin: 50% 50%; }
  #cv { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  .full { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; pointer-events: none; }
  #grain { mix-blend-mode: overlay; image-rendering: pixelated; }
  #vig { background: radial-gradient(ellipse 88% 72% at 50% 48%, rgba(0,0,0,0) 52%, rgba(0,0,0,.62) 100%); }
  #flash, #dip { opacity: 0; }
  #dip { background: #000; }
  .bar { position: absolute; left: 0; width: 1080px; background: #000; }
  .tt { position: absolute; left: 0; top: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; transform-origin: 50% 50%; white-space: nowrap; }
  .tt .ln { display: block; transform-origin: 50% 50%; white-space: nowrap; text-align: center; }
  .logo { position: absolute; left: 0; top: 0; border-radius: 50%; transform-origin: 50% 50%; }
  #caps { position: absolute; left: 50px; right: 50px; top: 1340px; height: 220px; display: flex; justify-content: center; align-items: center; flex-wrap: wrap; direction: rtl; gap: 0 18px; }
  .unbidi { unicode-bidi: isolate; direction: ltr; }

  /* ---------- cinema ---------- */
  .cinema .sm { font: 300 44px 'Heebo'; letter-spacing: .38em; color: #eaf3ef; text-shadow: 0 2px 18px rgba(0,0,0,.9); }
  .cinema .md { font: 700 84px 'Heebo'; letter-spacing: .08em; color: #fff; text-shadow: 0 4px 30px rgba(0,0,0,.85); }
  .cinema .lg { font: 800 124px 'Heebo'; letter-spacing: .06em; color: #fff; text-shadow: 0 6px 40px rgba(0,0,0,.85); }
  .cinema .xl { font: 800 176px 'Heebo'; letter-spacing: .05em; color: #fff; text-shadow: 0 8px 50px rgba(0,0,0,.85); }
  .cinema .num { font: 400 340px 'Bebas Neue'; color: #fff; letter-spacing: .02em; text-shadow: 0 0 60px rgba(255,190,120,.35), 0 8px 40px rgba(0,0,0,.8); }
  .cinema .acc { color: #ffcf8a; }
  .cinema #caps .w { font: 500 50px 'Heebo'; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,.9), 0 0 24px rgba(0,0,0,.8); }

  /* ---------- hype ---------- */
  .hype .sm { font: 800 50px 'Heebo'; letter-spacing: .12em; color: #0b0b0b; background: #B9FF3D; padding: 6px 26px; border-radius: 10px; }
  .hype .md { font: 900 104px 'Heebo'; color: #fff; text-shadow: 0 8px 0 rgba(0,0,0,.55), 0 0 30px rgba(0,0,0,.6); }
  .hype .lg { font: 900 150px 'Heebo'; color: #fff; text-shadow: 0 10px 0 rgba(0,0,0,.55), 0 0 40px rgba(0,0,0,.6); }
  .hype .xl { font: 700 330px 'Karantina'; line-height: .82; color: #fff; text-shadow: 0 12px 0 rgba(0,0,0,.5), 0 0 50px rgba(0,0,0,.6); }
  .hype .num { font: 400 380px 'Bebas Neue'; color: #B9FF3D; text-shadow: 0 12px 0 rgba(0,0,0,.5); }
  .hype .acc { color: #B9FF3D; }
  .hype #caps .w { font: 900 78px 'Heebo'; color: #fff; text-shadow: 0 6px 0 rgba(0,0,0,.8), 0 0 18px rgba(0,0,0,.7); display: inline-block; }
  .hype #caps .w.on { color: #B9FF3D; }

  /* ---------- doc ---------- */
  .doc .sm { font: 400 40px 'Heebo'; letter-spacing: .24em; color: #ffd9a8; text-shadow: 0 2px 14px rgba(0,0,0,.85); }
  .doc .md { font: 700 80px 'Heebo'; color: #fff; text-shadow: 0 3px 24px rgba(0,0,0,.85); }
  .doc .lg { font: 700 104px 'Heebo'; color: #fff; text-shadow: 0 4px 30px rgba(0,0,0,.85); }
  .doc .xl { font: 800 150px 'Heebo'; color: #fff; text-shadow: 0 6px 40px rgba(0,0,0,.85); }
  .doc .num { font: 400 300px 'Bebas Neue'; color: #fff; text-shadow: 0 6px 40px rgba(0,0,0,.8); }
  .doc .acc { color: #ffd9a8; }
  .doc .rule { width: 160px; height: 4px; background: #ffd9a8; border-radius: 4px; }
  .doc #caps { top: 1400px; }
  .doc #caps .box { background: rgba(0,0,0,.58); border-radius: 18px; padding: 14px 34px; font: 500 48px 'Heebo'; color: #fff; display: inline-block; }

  /* ---------- green ---------- */
  .green .sm { font: 500 40px 'Heebo'; letter-spacing: .34em; color: var(--g-hi); text-shadow: 0 0 14px rgba(43,227,138,.8); }
  .green .md, .green .lg, .green .xl { font-family: 'Karantina'; font-weight: 700; line-height: .86; background: var(--metal); -webkit-background-clip: text; background-clip: text; color: transparent;
     filter: drop-shadow(0 0 14px rgba(43,227,138,.55)) drop-shadow(0 5px 0 rgba(0,0,0,.65)); }
  .green .md { font-size: 160px; } .green .lg { font-size: 230px; } .green .xl { font-size: 320px; }
  .green .num { font: 400 380px 'Bebas Neue'; color: #F2FFF8; text-shadow: 0 0 10px #2BE38A, 0 0 30px #2BE38A, 0 0 60px rgba(43,227,138,.7); }
  .green .acc { color: #9DFFC9; }
  .green #caps .w { font: 800 66px 'Heebo'; color: #fff; text-shadow: 0 3px 0 rgba(0,0,0,.85), 0 0 22px rgba(0,0,0,.85); display: inline-block; }
  .green #caps .w.on { color: #9DFFC9; text-shadow: 0 3px 0 rgba(0,0,0,.85), 0 0 16px rgba(43,227,138,.95); }
</style>
</head>
<body>

  <canvas id="cv" width="1080" height="1920"></canvas>
  <div id="titles" class="full"></div>
  <div id="caps"></div>
</div>
<div id="vig" class="full"></div>
<canvas id="grain" class="full" width="540" height="960"></canvas>
<div id="bars" class="full"></div>

<script src="assets.js"></script>

</body>
</html>
