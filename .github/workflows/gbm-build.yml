name: GBM build & test

on:
  push:
    paths: ['gbm/**', '.github/workflows/gbm-build.yml']
  pull_request:
    paths: ['gbm/**']
  workflow_dispatch:

defaults:
  run:
    working-directory: gbm

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: gbm/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @gbm/desktop build
      - run: npx playwright install --with-deps chromium
      - run: pnpm test:e2e

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: gbm/pnpm-lock.yaml }
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - name: Build Windows installer (Tauri)
        working-directory: gbm/apps/desktop
        run: pnpm tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: gbm-windows
          path: |
            gbm/apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            gbm/apps/desktop/src-tauri/target/release/bundle/msi/*.msi

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: gbm/pnpm-lock.yaml }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - run: pnpm install --frozen-lockfile
      - name: Build web bundle and sync Capacitor
        working-directory: gbm/apps/mobile
        run: pnpm build && npx cap sync android
      - name: Assemble debug APK
        working-directory: gbm/apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: gbm-android
          path: gbm/apps/mobile/android/app/build/outputs/apk/debug/*.apk
