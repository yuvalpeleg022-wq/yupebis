name: Fetch movie posters

on:
  workflow_dispatch:
  push:
    paths:
      - 'marvel/index.html'
      - 'marvel/tools/fetch_posters.py'
      - '.github/workflows/fetch-posters.yml'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python marvel/tools/fetch_posters.py
      - name: Commit posters
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marvel/posters
          if git diff --cached --quiet; then echo "No new posters"; exit 0; fi
          git commit -m "Add movie posters from Wikipedia"
          git push
