[package]
name = "global-basketball-manager"
version = "0.1.0"
description = "Global Basketball Manager — One World. Every League. Your Legacy."
edition = "2021"
rust-version = "1.77"

[lib]
name = "gbm_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
