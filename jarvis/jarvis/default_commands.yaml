# ╔══════════════════════════════════════════════════════════════╗
# ║  פקודות מותאמות אישית                                        ║
# ║  אפשר לערוך בזמן שג'רוויס פועל – נשמר = עובד מיד.            ║
# ╚══════════════════════════════════════════════════════════════╝
#
# say: משפטים שמפעילים את הפקודה (מספיק שהמשפט יופיע בתוך מה שאמרת)
# do:  רשימת פעולות לפי הסדר:
#   open: <אפליקציה / אתר / תיקייה>    – כמו "פתח ..."
#   open_url: <כתובת>
#   open_path: <נתיב לקובץ או תיקייה>
#   youtube: <מה לחפש ולנגן ביוטיוב>
#   search: <חיפוש בגוגל>
#   run: <פקודת cmd>
#   speak: <מה ג'רוויס יגיד>
#   wait: <שניות>

- say: ["בוקר טוב", "good morning"]
  do:
    - speak: "בוקר טוב! פותח לך את החדשות."
    - open_url: https://www.ynet.co.il

- say: ["מצב משחק", "gaming mode"]
  do:
    - speak: "מצב משחק מופעל."
    - open: steam
    - open: discord

- say: ["תנגן מוזיקה", "play music"]
  do:
    - open: spotify
