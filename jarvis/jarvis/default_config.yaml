# ╔══════════════════════════════════════════════════════════════╗
# ║  J.A.R.V.I.S — קובץ הגדרות                                    ║
# ║  אפשר לערוך את הקובץ בזמן שג'רוויס פועל: כל שמירה נטענת מיד. ║
# ╚══════════════════════════════════════════════════════════════╝

user_name: "אדוני"          # איך ג'רוויס פונה אליך
theme: gold                  # gold (זהב) | cyan (כחול)

window:
  mode: fullscreen           # fullscreen | window
  always_on_top: false
  start_hidden: false        # להתחיל ממוזער למגש המערכת
  hotkey: "ctrl+alt+j"       # קיצור מקלדת גלובלי להצגה/הסתרה

startup:
  run_on_login: false        # להפעיל את ג'רוויס אוטומטית כשנכנסים ל-Windows

voice:
  enabled: true
  wake_words: ["ג'רוויס", "ג'ארביס", "ג'רביס", "ג'ארוויס", "גרוויס", "jarvis", "jervis"]
  require_wake_word: true    # true = צריך להגיד "ג'רוויס" לפני פקודה
  follow_up_seconds: 10      # אחרי פקודה אפשר להמשיך לדבר בלי להגיד שוב "ג'רוויס"
  stt_engine: whisper        # whisper (בלי אינטרנט) | google (מהיר, דורש אינטרנט)
  whisper_model: small       # tiny | base | small | medium | large-v3 | ivrit-ai/whisper-large-v3-turbo-ct2
  whisper_device: auto       # auto | cpu | cuda
  language: he               # he | en | null (זיהוי אוטומטי)
  input_device: null         # שם/מספר מיקרופון. null = ברירת המחדל של Windows
  vad_sensitivity: 3.0       # כמה חזק מעל רעש הרקע נחשב דיבור (נמוך = רגיש יותר)
  silence_ms: 700            # כמה שקט מסיים משפט
  max_utterance_s: 15

speaker:
  require_match: true        # להגיב רק לקול שלך
  threshold: null            # null = נקבע אוטומטית בזמן לימוד הקול. גבוה יותר = מחמיר יותר

tts:
  enabled: true
  engine: edge               # edge (קול טבעי, דורש אינטרנט) | system | none
  voice: he-IL-AvriNeural    # he-IL-AvriNeural (גבר) | he-IL-HilaNeural (אישה)
  rate: "+8%"

install:
  confirm: true              # לשאול "להתקין?" לפני התקנה
  silent: true

web:
  unknown_open: first_result # first_result = לפתוח ישר את התוצאה הראשונה | google = דף חיפוש

# האפליקציות בפאנלים בצדדים. open = מה לפתוח (שם אפליקציה, אתר או תיקייה)
dock:
  left:
    - {code: Ch, name: Chrome,      open: chrome}
    - {code: Fe, name: Explorer,    open: explorer}
    - {code: Wd, name: Word,        open: word}
    - {code: Xl, name: Excel,       open: excel}
    - {code: Pp, name: PowerPoint,  open: powerpoint}
    - {code: Vs, name: VS Code,     open: visual studio code}
    - {code: Np, name: Notepad,     open: notepad}
  right:
    - {code: Sp, name: Spotify,     open: spotify}
    - {code: Dc, name: Discord,     open: discord}
    - {code: Wa, name: WhatsApp,    open: whatsapp}
    - {code: St, name: Steam,       open: steam}
    - {code: Ca, name: Calculator,  open: calculator}
    - {code: Se, name: Settings,    open: settings}
    - {code: Tm, name: Task Mgr,    open: task manager}

