<!doctype html>
<html lang="he" dir="rtl" data-theme="gold">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>J.A.R.V.I.S</title>
<meta name="description" content="J.A.R.V.I.S – עוזר קולי הולוגרפי לטלפון">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JARVIS">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/mobile.css">
<script type="importmap">
{ "imports": {
    "three": "./vendor/three/build/three.module.min.js",
    "three/addons/": "./vendor/three/addons/"
} }
</script>
</head>
<body data-state="boot">
<canvas id="scene"></canvas>
<div id="fx" aria-hidden="true"></div>

<header id="top">
  <div class="brand"><div class="logo">J.A.R.V.I.S</div><div class="sub">PERSONAL AI SYSTEM</div></div>
  <div class="right">
    <div id="t-time">--:--</div>
    <div class="chips"><span class="chip" id="chip-ai">AI</span><span class="chip" id="chip-bat" hidden>BAT</span></div>
  </div>
</header>

<main id="center" aria-live="polite">
  <button id="core" aria-label="לחץ כדי לדבר">
    <span class="clock" id="core-time">00:00</span>
    <span class="date" id="core-date"></span>
    <span class="state" id="core-state">INITIALIZING</span>
  </button>
</main>

<section id="talk">
  <div id="transcript" dir="auto"></div>
  <div id="reply" dir="auto"></div>
</section>

<div id="cards" aria-live="polite"></div>

<nav id="quick" aria-label="קיצורים"></nav>

<footer id="dock">
  <button class="round" id="btn-kbd" aria-label="הקלדה">
    <svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h.01M11 10h.01M15 10h.01M7 14h10"/></svg>
  </button>
  <button id="mic" aria-label="דבר עם ג'רוויס">
    <span class="ring"></span><span class="ring r2"></span>
    <svg viewBox="0 0 24 24"><rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7"/></svg>
  </button>
  <button class="round" id="btn-settings" aria-label="הגדרות">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
</footer>

<form id="cmd" hidden autocomplete="off">
  <input id="cmd-input" dir="auto" placeholder="הקלד פקודה…" enterkeyhint="send">
  <button type="submit" aria-label="שלח">›</button>
</form>

<!-- settings sheet -->
<div id="sheet" class="sheet" hidden>
  <div class="panel">
    <div class="title">SETTINGS · הגדרות</div>
    <label>מפתח AI של Anthropic (לדיבור חופשי)
      <input id="set-key" type="password" placeholder="sk-ant-…" autocomplete="off" spellcheck="false" dir="ltr">
      <small>נשמר רק בטלפון הזה. מקבלים ב-console.anthropic.com ← API Keys</small>
    </label>
    <label>איך לפנות אליך <input id="set-name" placeholder="אדוני"></label>
    <label>צבע
      <select id="set-theme"><option value="gold">כתום (כמו בסרטון)</option><option value="green">ירוק</option><option value="cyan">כחול</option></select>
    </label>
    <label>ניווט עם
      <select id="set-nav"><option value="waze">Waze</option><option value="google">Google Maps</option></select>
    </label>
    <label class="row"><input type="checkbox" id="set-wake"> האזנה רציפה עם "ג'רוויס" (צורך יותר סוללה)</label>
    <label class="row"><input type="checkbox" id="set-voice" checked> תשובות קוליות</label>
    <div class="btns"><button id="set-save">שמור</button><button id="set-close" class="ghost">סגור</button></div>
    <p class="hint" id="install-hint"></p>
  </div>
</div>

<div id="toasts"></div>
<div id="boot"><div class="boot-logo">J.A.R.V.I.S</div><div class="boot-bar"><i></i></div></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
